<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Timelapse Tube</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header>
      <h1><a href="/">Timelapse Tube</a></h1>
      <div class="header-pill-container">
        <a href="/avi" class="avi-pill-link" title="Open AVI conversion queue">
          <span id="avi-pill" class="avi-pill avi-pill--green">0 .avi</span>
        </a>
      </div>
    </header>
    <main>
      <section id="player-section" class="hidden">
        <video id="player" controls preload="metadata" width="800">
          <source id="player-src" src="" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
        <div id="current-duration">Duration: —</div>
        <h2 id="now-playing">No video selected</h2>
        <div id="meta-editor">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <h3 style="margin:0; flex:1;">Video details</h3>
            <button id="meta-toggle" class="meta-toggle" aria-expanded="true" title="Collapse">▾</button>
          </div>
          <div id="meta-collapsed" class="meta-collapsed" style="display:none"></div>
          <div class="meta-field">
            <label>Friendly name</label>
            <input id="meta-name" type="text" placeholder="Short friendly title" />
          </div>
          <div class="meta-field">
            <label>Description</label>
            <textarea id="meta-desc" rows="3" placeholder="Short description"></textarea>
          </div>
          <div class="meta-field">
            <label>Makerworld link</label>
            <div class="meta-link-row">
              <input id="meta-link" type="text" placeholder="https://maker.world/…" />
              <button id="meta-open" type="button">Open</button>
            </div>
          </div>
          <div class="meta-field" style="display:flex; gap:12px; align-items:center;">
            <button id="meta-save">Save</button>
            <span id="meta-status" class="meta-status"></span>
          </div>
        </div>
      </section>

      <section id="list-section">
        <h3>Videos</h3>
        <div id="controls">
          <label for="sort-select">Sort:</label>
          <select id="sort-select">
            <option value="name">Name</option>
            <option value="date">Date</option>
            <option value="size">Size</option>
          </select>
          <select id="order-select">
            <option value="desc">Desc</option>
            <option value="asc">Asc</option>
          </select>
        </div>
        <ul id="video-list"></ul>
      </section>
    </main>
    <script src="/static/app.js?v=3"></script>
  </body>
</html>
